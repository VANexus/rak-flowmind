# ──────────────────────────────────────────────────────────────
# FlowMind 依赖真源（conda 完全接管；uv.lock 已废弃删除）
#
# 安装 / 更新：
#   conda env update -n flowmind -f environment.yml   # 或 env create
#   conda run -n flowmind pip install -e . --no-deps  # 包本体 + entry points
#
# GPU 说明（NVIDIA P104-100，8GB，Compute Capability 6.1 / Pascal）：
#   - torch 锁 2.5.1+cu121：cu121 构建含 sm_61（Pascal），且携带
#     nvidia-*-cu12 pip 依赖（含 cuDNN 9），与 ctranslate2(faster-whisper)
#     的 GPU 运行时需求对齐。cu124+ 构建已剔除 Pascal，勿升级改源。
#   - 模型缓存/下载已配在 ~/.bashrc：HF_HOME=/srv/data/models + 代理 127.0.0.1:7890
# ──────────────────────────────────────────────────────────────
name: flowmind
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      # ── GPU 运行时（Pascal 6.1 约束见文件头注释）──
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1+cu121
      - nvidia-cublas-cu12
      - nvidia-cudnn-cu12
      # ── 本地模型栈（进程内库，lazy import）──
      - faster-whisper>=1.0        # 本地 ASR（CTranslate2，支持 CC≥6.0）
      - rapidocr-onnxruntime>=1.3  # 本地 OCR（CPU，字幕条定位）
      - sentence-transformers>=3   # 本地向量嵌入（bge-small-zh）
      - simple-lama-inpainting>=0.1.2  # 本地字幕擦除（big-lama，首次用时代理下载模型）
      - qwen-tts>=0.1.1            # 本地声音克隆（Qwen3-TTS 0.6B Base，零样本；
                                   #   首次用时代理下载模型到 HF 缓存）
      # ⚠️ qwen-tts 会把 torchaudio 升到不匹配 torch 2.5.1 的版本
      #    （libcudart.so.13 加载失败），必须在其后重新钉回 cu121 配套版
      - torchaudio==2.5.1+cu121
      - demucs>=4.0                # 本地人声分离（htdemucs，MIT）；BGM 净化用
                                   #   ⚠️ 模型 ~160MB 首次经代理下载到 TORCH_HOME
                                   #   （/srv/data/models/torch，见 CLAUDE.md 缓存约定）
      # 系统级依赖（不在 conda/pip 管辖）：sudo apt install sox
      #   （qwen-tts 依赖的 python-sox 包装需要 sox 二进制）
      # 系统级依赖：sudo apt install fonts-noto-cjk ffmpeg
      #   （中文字幕渲染 + 擦除/混音全流程）
      # ── 项目原依赖（同步自 pyproject.toml）──
      - mcp>=1.27,<2
      - pydantic>=2
      - tomli-w>=1.0
      - numpy>=1.26
      - jieba>=0.42.1
      - rank-bm25>=0.2.2
      - scikit-learn>=1.3
      - requests>=2.34.2
      - httpx>=0.27
      - python-dotenv>=1.2.2
      - dashscope>=1.27.1
      - markdown-it-py>=4.0
      - linkify-it-py>=2.0       # content_typeset linkify=True 必需（markdown-it-py 可选依赖）
      - css-inline>=0.20
      - uvicorn>=0.30
      - a2a-sdk>=0.1.0
      - langchain>=0.3
      - langchain-core>=0.3
      - langgraph>=0.2
      - playwright>=1.62.0
      # ── 开发工具（原 dev extras）──
      - pytest>=8
      - pytest-asyncio>=0.23
      - ruff>=0.6
      - python-docx>=1.0
