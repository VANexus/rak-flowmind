# ──────────────────────────────────────────────────────────────
# mcp-base-gpu 依赖真源（conda 完全接管；uv.lock 已废弃删除）
#
# 定位：视频本地化 MCP over HTTP SaaS 服务端（7 个 localize_* 技能
# + PG 任务引擎 + MQTT 事件 + Milvus 字幕检索）。
#
# 安装 / 更新（simple-lama 须单独 --no-deps 补装，原因见本地模型栈段）：
#   conda env update -n flowmind -f environment.yml   # 或 env create
#   conda run -n flowmind pip install --no-deps "simple-lama-inpainting>=0.1.2"
#   conda run -n flowmind pip install -e . --no-deps  # 包本体 + entry points
#
# GPU 说明（NVIDIA P104-100，8GB，Compute Capability 6.1 / Pascal）：
#   - torch 锁 2.6.0+cu126：cu126 是**唯一仍带 Pascal 的 CUDA 构建**——
#     PyTorch 各版本的 .ci/manywheel 构建表里只有 12.6 保留 "5.0;6.0"，
#     cu128/12.9/13.x 均已剔除 sm_50~sm_70。它同时携带 nvidia-*-cu12 pip
#     依赖（含 cuDNN 9），与 ctranslate2(faster-whisper) 的 GPU 运行时需求对齐。
#     注意 wheel 里是 sm_60 cubin（无 sm_61），靠同 major 内前向兼容跑在 sm_61
#     的 P104 上——cu121 的 2.5.1 同理（其 arch_list 同样只有 sm_60）。
#     ⚠️ 勿升到 cu128+：那会直接丢失 Pascal 支持。
#   - 模型缓存/下载已配在 ~/.bashrc：HF_HOME=/srv/data/models + 代理 127.0.0.1:7890
#     国内网络下 download.pytorch.org 走代理极慢（实测 ~64KB/s），可临时改用
#     阿里云镜像加速（已验证 22MB/s，内容与官方 cu126 索引一致）：
#       pip install --index-url https://mirrors.aliyun.com/pypi/simple/ \
#         --find-links https://mirrors.aliyun.com/pytorch-wheels/cu126/ \
#         "torch==2.6.0+cu126" "torchaudio==2.6.0+cu126" \
#         "nvidia-cublas-cu12==12.6.4.1" "nvidia-cudnn-cu12==9.5.1.17"
# ──────────────────────────────────────────────────────────────
name: flowmind
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - scenedetect
      - opencv-python-headless
      # ── GPU 运行时（Pascal 6.1 约束见文件头注释）──
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.6.0+cu126
      #   CUDA 伴生库必须钉到 torch 2.6.0+cu126 metadata 所需的精确版本：
      #   conda env update 的 pip 子进程带 -U，裸名称会被解析到最新版
      #   （cublas 12.9 / cudnn 9.25），与 torch 的 CUDA 12.6 运行时不兼容。
      - nvidia-cublas-cu12==12.6.4.1
      - nvidia-cudnn-cu12==9.5.1.17
      # ── 本地模型栈（进程内库，lazy import）──
      - faster-whisper>=1.0        # 本地 ASR（CTranslate2，支持 CC≥6.0）
      # 本地 OCR（CPU）。**新包名** `rapidocr` v3（2026-10-16 修漂移：此前钉旧包
      # `rapidocr-onnxruntime`，而实况是只有新包 ⇒ `available()` 恒 False、「本地优先」静默落到云 OCR）。
      # 两处消费者：**字幕条定位**（`skills/_local_ocr.py`，带位置/尺寸先验与 <0.5 过滤）与
      # **dsp 文字核查侧车**（`flowmind.ocr_lines`，零过滤、逐行给四点框与置信度）。
      # 旧包名仍被 `_local_ocr.py` 认（回落 v1 的返回形状），但**不再是声明的那一个**。
      - rapidocr>=3.10
      # ⚠️ onnxruntime **必须显式声明**（2026-10-16 补）：rapidocr 自己不依赖它（只在
      # `inference_engine/onnxruntime/` 里懒加载），它的依赖里只有 opencv-python-headless ⇒
      # 少了这一个，`available()` 仍回 True（那探针只做 import，探不到这一层），**引擎初始化才炸**
      # （OcrLinesError / OCRError，category=environment）——即「本地优先」选了个跑不起来的后端。
      # 镜像里钉 ==1.31.0（deploy/ocr-sidecar/Dockerfile 顶部有同一句话）；这里按本段惯例用下限。
      - onnxruntime>=1.31
      # ⚠️ simple-lama-inpainting 不能进本 pip 段：0.1.2 的依赖声明
      #   （pillow>=9.5,<10）是 stale metadata——Pillow 9.5 无 py3.12 wheel，
      #   源码编译又需系统 libjpeg 头，任何完整 resolver pass 都必失败；
      #   其本体与 Pillow 12 运行时兼容（仅用 Image.open/convert），
      #   Pillow 由 rapidocr 等依赖带入，故按文件头序列用 --no-deps 单独补装
      #   （字幕擦除 erase_backend=local/lama 用，big-lama 首次用时代理下载模型）。
      - qwen-tts>=0.1.1            # 本地声音克隆（Qwen3-TTS 0.6B Base，零样本；
                                   #   首次用时代理下载模型到 HF 缓存）
      - funasr>=1.4                # 本地说话人分离（CAM++ 192 维声纹嵌入 + 谱聚类；
                                   #   多人对话逐角色配音用，默认 CPU 不占 8GB 显存）
                                   #   ⚠️ 会带入 modelscope / onnxruntime / torch_complex 等；
                                   #   首次用时代理从 modelscope 下载 CAM++ 与 VAD 模型
      # ⚠️ qwen-tts 与 funasr 都可能把 torch/torchaudio 升到不匹配 torch 2.6.0
      #    的版本（libcudart.so.13 加载失败），必须在其后重新钉回 cu126 配套版
      - torch==2.6.0+cu126
      - torchaudio==2.6.0+cu126
      - demucs>=4.0                # 本地人声分离（htdemucs，MIT）；BGM 净化用
                                   #   ⚠️ 模型 ~160MB 首次经代理下载到 TORCH_HOME
                                   #   （/srv/data/models/torch，见 CLAUDE.md 缓存约定）
      # 系统级依赖（不在 conda/pip 管辖）：sudo apt install sox
      #   （qwen-tts 依赖的 python-sox 包装需要 sox 二进制）
      # 系统级依赖：sudo apt install fonts-noto-cjk ffmpeg
      #   （中文字幕渲染 + 擦除/混音全流程）
      # ── 框架与服务 ──
      - mcp>=1.27,<2               # MCP 协议（FastMCP v1；v2 需重验 _make_tool 反射）
      - pydantic>=2
      - tomli-w>=1.0
      - uvicorn>=0.30              # Streamable HTTP / REST 服务运行时
      - python-dotenv>=1.2.2       # 服务进程启动加载 .env（密钥不入 toml/commit）
      - requests>=2.34.2
      - httpx>=0.27
      - dashscope>=1.27.1          # 云回落（qwen-audio ASR/TTS / qwen3.5-ocr / 声音复刻）
      - numpy>=1.26
      # ── 包装刀板族（packaging_dieline）──
      - shapely>=2.0               # 几何独立复核：并集/外扩/线长，与前端 clipper-lib 对账（硬前置）
      - ezdxf>=1.3                 # DXF 刀模文件（模切厂直接可用）；懒加载——缺它少产一件并如实写进 missing
      - reportlab>=4.2             # 1:1 毫米 PDF 刀线；同上（懒加载，不装不影响其它族）
      # ── 任务引擎基础设施（PG 存储 / MQTT 事件 / Milvus 向量库）──
      - psycopg2-binary>=2.9       # TaskStore（经 PgBouncer 事务模式，短连接）
      - paho-mqtt>=2.0             # 任务进度事件（EMQX，终态 retain）
      - pymilvus>=2.4              # 字幕分段向量库（localize_segments，768 维 bge）
      - boto3>=1.34                # dsp 成片产物对象存储（S3/MinIO 兼容；懒加载）
      # ── 认证（ECO-ADR-0011 D4）──
      - pyjwt[crypto]>=2.9         # 校验网关 RS256 JWT + JWKS 本地验签（crypto=RSA 后端）
      # ── 开发工具 ──
      - ruff>=0.6                  # lint（合并前唯一质量门；本仓库无单测，验证靠 demo）
