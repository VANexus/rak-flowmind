[project]
name = "mcp-base-gpu"
version = "0.2.0"
description = "视频本地化 MCP over HTTP SaaS 服务端 —— 7 个 localize_* 工具 + PG 任务引擎"
readme = "README.md"
requires-python = ">=3.11"
# ⚠️ 依赖真源 = environment.yml（conda，2026-09 GPU 化升级接管）。
# 下面 dependencies 仅为 pip 安装兜底快照，新增依赖请改 environment.yml。
dependencies = [
    "mcp>=1.27,<2",
    "pydantic>=2",
    "numpy>=1.26",
    "requests>=2.34.2",
    "httpx>=0.27",
    "python-dotenv>=1.2.2",
    "dashscope>=1.27.1",
    "uvicorn>=0.30",
    # 任务引擎基础设施（PG 存储 / MQTT 事件 / Milvus 向量库）
    "psycopg2-binary>=2.9",
    "paho-mqtt>=2.0",
    "pymilvus>=2.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[project.scripts]
mcp-base-gpu = "flowmind.server_http:main"   # 单端口唯一入口（MCP + 任务 REST）
flowmind-mcp = "flowmind.server:main"        # stdio 调试入口

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowmind"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 显式固定规则集：经典默认（E4/E7/E9/F）+ I（import 排序，仓库约定按字母序）。
# ruff 0.16 起默认规则集大扩容（全量启用），不加这条会导致存量代码大面积误报。
select = ["E4", "E7", "E9", "F", "I"]
