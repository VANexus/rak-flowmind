[project]
name = "rak-flowmind"
version = "0.1.0"
description = "FlowMind Skill SDK —— 对任意 Agent 友好的技能底座"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27,<2",
    "pydantic>=2",
    "tomli-w>=1.0",
    # feishu_kb skill deps
    "numpy>=1.26",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.3",
    # PR #4: localize_* HTTP calls
    "requests>=2.34.2",
    # PR #5: allin-api gpt-image-2 + chat completions
    "httpx>=0.27",
    "python-dotenv>=1.2.2",
    "dashscope>=1.27.1",
    # content_typeset 技能：公众号 Markdown -> 内联样式 HTML（doocs/md 主题）
    "markdown-it-py>=4.0",
    "css-inline>=0.20",
    # content_* 技能 + flowmind-mcp-http（Streamable HTTP transport 起服务）
    "uvicorn>=0.30",
    # A2A 协议层
    "a2a-sdk>=0.1.0",
    # 编排层
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "playwright>=1.62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "python-docx>=1.0",  # 用于 scripts/build_seed_from_docx.py 重生 seed
]

[project.scripts]
flowmind-mcp = "flowmind.server:main"
flowmind-mcp-http = "flowmind.server_http:main"
flowmind-init = "flowmind.interactive:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowmind"]

[tool.pytest.ini_options]
# addopts 显式加载 asyncio 插件，使 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 下仍能跑异步测试
addopts = ["-p", "asyncio"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "real_backend: 不打桩出图后端（测 select_backend 真实错误路径）",
]

[tool.ruff]
line-length = 100
target-version = "py311"
