[project]
name = "mcp-base-gpu"
version = "0.2.0"
description = "MCP over HTTP SaaS 服务端 —— localize 族 7 个 + dsp 族 8 个工具 + PG 任务引擎"
readme = "README.md"
requires-python = ">=3.11"
# ⚠️ 依赖真源 = environment.yml（conda，2026-09 GPU 化升级接管）。
# 下面 dependencies 仅为 pip 安装兜底快照，新增依赖请改 environment.yml。
dependencies = [
    "mcp>=1.27,<2",
    "pydantic>=2",
    "numpy>=1.26",
    "requests>=2.34.2",
    "httpx>=0.27",
    "python-dotenv>=1.2.2",
    "dashscope>=1.27.1",
    "uvicorn>=0.30",
    # 任务引擎基础设施（PG 存储 / MQTT 事件 / Milvus 向量库）
    "psycopg2-binary>=2.9",
    "paho-mqtt>=2.0",
    "pymilvus>=2.4",
    # dsp 成片技能族：产物对象存储（S3/MinIO 兼容；懒加载，不装不影响其它技能）
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[project.scripts]
mcp-base-gpu = "flowmind.server_http:main"   # 单端口唯一入口（MCP + 任务 REST）
flowmind-mcp = "flowmind.server:main"        # stdio 调试入口
# ⚠️ 这条命令**不在本文件提依赖**（`dependencies` 只是**服务运行时**的 pip 兜底快照，且侧车刻意
# 不属于服务）：它要的 `rapidocr` + `onnxruntime` 是**开发环境**那条路的依赖，真源在 `environment.yml`
# （照文档装即可用；`onnxruntime` 必须显式装，原因见那边的注释）。默认/生产那条路是容器，
# 依赖钉在 `deploy/ocr-sidecar/Dockerfile`（ADR-100）。
rapidocr-sidecar = "flowmind.ocr_sidecar:main"  # 本机 OCR 侧车（cross-dashboard 文字核查直连，ADR-097）

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowmind"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 显式固定规则集：经典默认（E4/E7/E9/F）+ I（import 排序，仓库约定按字母序）。
# ruff 0.16 起默认规则集大扩容（全量启用），不加这条会导致存量代码大面积误报。
select = ["E4", "E7", "E9", "F", "I"]
